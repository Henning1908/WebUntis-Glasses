services:
  - type: web
    name: webuntis-glasses
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: webuntis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: WEBUNTIS_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data

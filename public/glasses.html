<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebUntis Glasses · Standalone</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/.well-known/meta-wearables-manifest.json">
</head>
<body class="glasses-page">
  <main class="glasses-app">
    <span class="glasses-brand">WEBUNTIS</span>
    <h1 id="glass-title">Mit PC verbinden</h1>
    <p id="pair-instruction">Gib diesen Code auf dem PC ein:</p>
    <div id="pair-code" class="pair-code">------</div>
    <p id="pair-state" class="muted">Verbindung wird vorbereitet ...</p>
    <button id="disconnect" class="glasses-disconnect" type="button">Verbindung trennen</button>
    <section id="glass-next" class="glasses-next" hidden>
      <span class="next-label">NÄCHSTER UNTERRICHT</span>
      <strong id="next-subject">—</strong>
      <div id="next-time" class="next-time">--:--–--:--</div>
      <div id="next-room" class="next-meta">Raum wird geladen ...</div>
      <div id="next-date" class="next-meta"></div>
      <div id="next-status" class="next-status"></div>
    </section>
    <section id="glass-day" class="glasses-day" hidden>
      <div class="day-heading">
        <span class="next-label">TAGESPLAN</span>
        <strong id="day-title">Heute</strong>
      </div>
      <div id="day-entries"></div>
      <div class="day-controls">
        <button id="day-back" type="button" aria-label="Vorheriger Tag">←</button>
        <span id="day-position"></span>
        <button id="day-forward" type="button" aria-label="Nächster Tag">→</button>
      </div>
      <div class="swipe-hint">← zurück · weiter →</div>
    </section>
  </main>
  <script>
    (function () {
      var code = document.getElementById("pair-code");
      var title = document.getElementById("glass-title");
      var instruction = document.getElementById("pair-instruction");
      var state = document.getElementById("pair-state");
      var next = document.getElementById("glass-next");
      var nextSubject = document.getElementById("next-subject");
      var nextTime = document.getElementById("next-time");
      var nextRoom = document.getElementById("next-room");
      var nextDate = document.getElementById("next-date");
      var nextStatus = document.getElementById("next-status");
      var day = document.getElementById("glass-day");
      var dayTitle = document.getElementById("day-title");
      var dayEntries = document.getElementById("day-entries");
      var dayPosition = document.getElementById("day-position");
      var dayBack = document.getElementById("day-back");
      var dayForward = document.getElementById("day-forward");
      var disconnectButton = document.getElementById("disconnect");
      var pair = null;
      var dayGroups = [];
      var dayIndex = -1;
      var touchStartX = 0;
      var pointerStartX = 0;
      var pointerActive = false;
      var lastTimetable = null;
      var retryTimer = null;
      var savedId = window.localStorage ? window.localStorage.getItem("webuntis-glasses-device") : null;
      var savedProfile = window.localStorage ? window.localStorage.getItem("webuntis-glasses-profile") : null;
      function error(message) { state.innerHTML = message; state.className = "message error"; }
      function showRetry(message) {
        state.innerHTML = message;
        state.className = "muted";
        if (lastTimetable) {
          showNext(lastTimetable.next);
          buildDayGroups(lastTimetable.all);
        }
      }
      function text(items, fallback) {
        return items && items.length ? items.map(function (item) { return item.name; }).join(", ") : fallback;
      }
      function formatDate(value) {
        var raw = String(value || "");
        if (raw.length !== 8) return raw;
        return raw.substr(6, 2) + "." + raw.substr(4, 2) + "." + raw.substr(0, 4);
      }
      function todayKey() {
        var parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Berlin",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date()).filter(function (part) {
          return part.type !== "literal";
        }).map(function (part) {
          return [part.type, part.value];
        }));
        return parts.year + parts.month + parts.day;
      }
      function formatTime(value) {
        var result = String(value || "0000");
        while (result.length < 4) result = "0" + result;
        return result.substr(0, 2) + ":" + result.substr(2);
      }
      function renderDay() {
        if (dayIndex < 0 || !dayGroups[dayIndex]) {
          next.hidden = false;
          day.hidden = true;
          return;
        }
        var group = dayGroups[dayIndex];
        next.hidden = true;
        day.hidden = false;
        dayTitle.innerHTML = group.key === todayKey() ? "Heute" : formatDate(group.key);
        dayPosition.innerHTML = (dayIndex + 1) + " / " + dayGroups.length;
        dayBack.disabled = dayIndex <= 0;
        dayForward.disabled = dayIndex >= dayGroups.length - 1;
        dayEntries.innerHTML = group.items.length ? group.items.map(function (item) {
          var status = item.cancelled ? " · Entfällt" : (item.substitution || item.info ? " · " + (item.substitution || item.info) : "");
          return "<div class='day-entry'><time>" + formatTime(item.startTime) + "–" + formatTime(item.endTime) + "</time><div><strong>" + text(item.subjects, "Unterricht") + "</strong><small>Raum: " + text(item.rooms, "offen") + status + "</small></div></div>";
        }).join("") : "<p class='day-empty'>Keine weiteren Stunden.</p>";
      }
      function buildDayGroups(items) {
        var grouped = {};
        (items || []).forEach(function (item) {
          var key = String(item.date || "").replaceAll("-", "");
          if (!key) return;
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(item);
        });
        var keys = Object.keys(grouped).sort();
        var today = todayKey();
        if (keys.indexOf(today) === -1) keys.unshift(today);
        dayGroups = keys.map(function (key) {
          return { key: key, items: (grouped[key] || []).sort(function (left, right) {
            return Number(left.startTime || 0) - Number(right.startTime || 0);
          }) };
        });
        dayIndex = -1;
        renderDay();
      }
      function showNext(items) {
        var item = items && items[0];
        if (!item) {
          next.hidden = false;
          nextSubject.innerHTML = "Heute kein Unterricht";
          nextTime.innerHTML = "";
          nextRoom.innerHTML = "Keine weiteren Stunden im geladenen Zeitraum.";
          nextDate.innerHTML = "";
          nextStatus.innerHTML = "";
          return;
        }
        var start = String(item.startTime || "0000");
        var end = String(item.endTime || "0000");
        while (start.length < 4) start = "0" + start;
        while (end.length < 4) end = "0" + end;
        nextSubject.innerHTML = text(item.subjects, "Unterricht");
        nextTime.innerHTML = start.substr(0, 2) + ":" + start.substr(2) + "–" + end.substr(0, 2) + ":" + end.substr(2);
        nextRoom.innerHTML = "Raum: " + text(item.rooms, "Noch nicht festgelegt");
        nextDate.innerHTML = formatDate(item.date);
        nextStatus.innerHTML = item.cancelled ? "Entfällt" : (item.substitution || item.info || "");
        next.hidden = false;
      }
      function showConnected() {
        title.innerHTML = "Dein nächster Unterricht";
        instruction.hidden = true;
        code.hidden = true;
        state.innerHTML = "Verbunden";
      }
      function saveProfile(profile) {
        if (profile && window.localStorage) {
          window.localStorage.setItem("webuntis-glasses-profile", JSON.stringify(profile));
        }
      }
      function restoreSavedProfile() {
        if (!savedProfile) return Promise.resolve();
        return fetch("/api/glasses/restore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: savedProfile
        }).then(function (response) {
          if (!response.ok) throw new Error("Gespeichertes Profil konnte nicht wiederhergestellt werden.");
        }).catch(function () {});
      }
      disconnectButton.onclick = function () {
        fetch("/api/disconnect", { method: "POST" })
          .then(function () {
            if (window.localStorage) {
              window.localStorage.removeItem("webuntis-glasses-device");
              window.localStorage.removeItem("webuntis-glasses-profile");
            }
            pair = null;
            code.innerHTML = "------";
            state.innerHTML = "Verbindung getrennt. Seite neu laden.";
            next.hidden = true;
            day.hidden = true;
            title.innerHTML = "Mit PC verbinden";
            instruction.hidden = false;
            code.hidden = false;
          })
          .catch(function (reason) { error(reason.message); });
      };
      function checkPair() {
        if (!pair) return;
        fetch("/api/glasses/status?deviceId=" + encodeURIComponent(pair.id))
          .then(function (response) { return response.json(); })
          .then(function (current) {
            if (!current.connected) {
              showRetry(current.profileMissing
                ? "Profil fehlt – Code unten am PC oder Handy eingeben."
                : "Gerät wartet auf den Server …");
              return null;
            }
            saveProfile(current.profile);
            showConnected();
            return Promise.all([
              fetch("/api/glasses/timetable?deviceId=" + encodeURIComponent(pair.id)).then(function (response) {
                if (!response.ok) throw new Error("Stundenplan momentan nicht erreichbar.");
                return response.json();
              }),
              fetch("/api/glasses/timetable?deviceId=" + encodeURIComponent(pair.id) + "&includePast=1").then(function (response) {
                if (!response.ok) throw new Error("Tagesplan momentan nicht erreichbar.");
                return response.json();
              })
            ]);
          })
          .then(function (data) {
            if (!data) return;
            lastTimetable = { next: data[0].entries || [], all: data[1].entries || [] };
            showNext(lastTimetable.next);
            buildDayGroups(lastTimetable.all);
            state.innerHTML = "Direkt verbunden";
          })
          .catch(function (reason) {
            showRetry("Verbindung wird automatisch wiederhergestellt …");
            if (retryTimer) clearTimeout(retryTimer);
            retryTimer = setTimeout(checkPair, 5000);
          });
      }

      function moveDay(distance) {
        if (Math.abs(distance) < 45 || !dayGroups.length) return;
        if (distance > 0 && dayIndex < dayGroups.length - 1) dayIndex += 1;
        if (distance < 0 && dayIndex >= 0) dayIndex -= 1;
        renderDay();
      }
      function changeDay(direction) {
        if (dayIndex < 0) dayIndex = 0;
        dayIndex = Math.max(0, Math.min(dayGroups.length - 1, dayIndex + direction));
        renderDay();
      }
      dayBack.onclick = function () { changeDay(-1); };
      dayForward.onclick = function () { changeDay(1); };
      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight") changeDay(1);
        if (event.key === "ArrowLeft") changeDay(-1);
      });
      if (window.PointerEvent) {
        document.addEventListener("pointerdown", function (event) {
          if (event.pointerType === "touch" || event.pointerType === "pen") {
            pointerStartX = event.clientX;
            pointerActive = true;
          }
        });
        document.addEventListener("pointerup", function (event) {
          if (!pointerActive) return;
          pointerActive = false;
          moveDay(event.clientX - pointerStartX);
        });
      } else {
        document.addEventListener("touchstart", function (event) {
          if (event.touches && event.touches.length) touchStartX = event.touches[0].clientX;
        }, { passive: true });
        document.addEventListener("touchend", function (event) {
          if (!event.changedTouches || !event.changedTouches.length) return;
          moveDay(event.changedTouches[0].clientX - touchStartX);
        }, { passive: true });
      }
      fetch("/api/glasses/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deviceId: savedId })
      })
        .then(function (response) { return response.json(); })
        .then(function (result) {
          if (!result.id) throw new Error("Keine Geräteverbindung erhalten.");
          if (result.connected) {
            pair = result;
            saveProfile(result.profile);
            if (window.localStorage) window.localStorage.setItem("webuntis-glasses-device", result.id);
            showConnected();
            checkPair();
          } else {
            if (savedProfile) {
              restoreSavedProfile().then(function () {
                pair = { id: JSON.parse(savedProfile).deviceId, connected: true };
                if (window.localStorage) window.localStorage.setItem("webuntis-glasses-device", pair.id);
                showConnected();
                checkPair();
              });
              return;
            }
            pair = result;
            if (window.localStorage) {
              window.localStorage.removeItem("webuntis-glasses-device");
              window.localStorage.setItem("webuntis-glasses-device", result.id);
            }
            code.innerHTML = result.code.substr(0, 3) + " " + result.code.substr(3);
            state.innerHTML = "Code am PC eingeben ...";
          }
          setInterval(checkPair, 30000);
        })
        .catch(function (reason) { error(reason.message); });
      restoreSavedProfile().then(function () {
        if (savedId) {
          pair = { id: savedId, connected: true };
          showConnected();
          checkPair();
        }
      });
    }());
  </script>
</body>
</html>
